<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="/static/manifest.json"><title>TaskFlow Pro</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script><style>body{background:#07111f;color:#e5e7eb;font-family:Inter,system-ui}.glass{background:#0f172add;backdrop-filter:blur(16px);border:1px solid #ffffff12}.active{background:#4f46e522;color:#a5b4fc}.hide{display:none!important}.bar{height:8px;background:#1e293b;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#22c55e)}@media(max-width:768px){ #side{transform:translateX(-105%);transition:.2s}#side.open{transform:none}}</style></head><body>
<div id="auth" class="min-h-screen grid place-items-center p-5"><div class="glass p-7 rounded-3xl w-full max-w-md"><div class="text-center mb-6"><div class="text-4xl">⚡</div><h1 class="text-3xl font-black">TaskFlow <span class="text-indigo-400">Pro</span></h1><p class="text-slate-400 text-sm">Productivity command center</p></div><div class="grid grid-cols-2 gap-2 mb-5"><button id="lt" onclick="authMode('login')" class="p-3 rounded-xl bg-indigo-600">Login</button><button id="rt" onclick="authMode('register')" class="p-3 rounded-xl bg-slate-800">Create Account</button></div><div id="af"></div><p id="am" class="text-center text-sm mt-3"></p></div></div>
<div id="app" class="hide min-h-screen"><aside id="side" class="fixed top-0 bottom-0 w-64 p-4 glass z-40"><h1 class="font-black text-xl p-3">⚡ TaskFlow <span class="text-indigo-400">Pro</span></h1><nav id="nav" class="space-y-1 mt-4"></nav><div class="absolute bottom-4 left-4 right-4 glass rounded-xl p-3"><small class="text-slate-500">Signed in as</small><div id="su" class="font-bold truncate"></div><button onclick="logout()" class="text-rose-300 text-xs mt-2">Sign out</button></div></aside><main class="md:ml-64"><header class="sticky top-0 z-30 glass p-4 flex justify-between"><div class="flex gap-3 items-center"><button class="md:hidden bg-slate-800 rounded-xl px-3 py-2" onclick="toggleSide()">☰</button><div><h2 id="pt" class="font-black text-xl"></h2><p id="ps" class="text-xs text-slate-500"></p></div></div><button onclick="openTask()" class="bg-indigo-600 rounded-xl px-4 py-2 font-bold">+ Task</button></header><div id="content" class="p-4 md:p-7 max-w-7xl mx-auto"></div></main></div>
<div id="modal" class="hide fixed inset-0 z-50 bg-black/75 p-4 items-center justify-center"><div class="glass rounded-3xl p-6 w-full max-w-2xl"><div class="flex justify-between mb-4"><h3 id="mt" class="text-xl font-black">New Task</h3><button onclick="closeTask()">✕</button></div><div class="grid md:grid-cols-2 gap-3"><input id="title" class="bg-slate-900 rounded-xl p-3 md:col-span-2" placeholder="Task title *"><textarea id="desc" class="bg-slate-900 rounded-xl p-3 md:col-span-2" placeholder="Description"></textarea><select id="pri" class="bg-slate-900 rounded-xl p-3"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select><select id="status" class="bg-slate-900 rounded-xl p-3"><option value="todo">To Do</option><option value="in-progress">In Progress</option><option value="done">Completed</option></select><select id="cat" class="bg-slate-900 rounded-xl p-3"><option>General</option><option>Study</option><option>Work</option><option>Personal</option><option>Project</option><option>Health</option></select><input id="tag" class="bg-slate-900 rounded-xl p-3" placeholder="Tag"><input id="due" type="datetime-local" class="bg-slate-900 rounded-xl p-3"><select id="rem" class="bg-slate-900 rounded-xl p-3"><option value="0">No reminder</option><option value="5">5 min</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">1 hour</option></select><label class="bg-slate-900 rounded-xl p-3"><input id="imp" type="checkbox"> ⭐ Important</label><textarea id="notes" class="bg-slate-900 rounded-xl p-3 md:col-span-2" placeholder="Optional notes"></textarea></div><div class="flex justify-end gap-2 mt-5"><button onclick="closeTask()" class="bg-slate-800 rounded-xl px-4 py-2">Cancel</button><button onclick="saveTask()" class="bg-indigo-600 rounded-xl px-5 py-2 font-bold">Save</button></div></div></div>
<script>
let tok=localStorage.getItem('tf_token'),me=null,ts=[],editId=null,page='dashboard';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const api=async(p,o={})=>{o.headers={'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})};let r=await fetch(p,o),d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error('Session expired')}if(!r.ok)throw Error(d.error||'Request failed');return d};
function authMode(m){$('lt').className='p-3 rounded-xl '+(m==='login'?'bg-indigo-600':'bg-slate-800');$('rt').className='p-3 rounded-xl '+(m==='register'?'bg-indigo-600':'bg-slate-800');$('af').innerHTML=m==='login'?'<input id="email" type="email" class="w-full bg-slate-900 rounded-xl p-3 mb-3" placeholder="Email"><input id="pass" type="password" class="w-full bg-slate-900 rounded-xl p-3 mb-4" placeholder="Password"><button onclick="auth(\'login\')" class="w-full bg-indigo-600 rounded-xl p-3 font-bold">Login</button>':'<input id="name" class="w-full bg-slate-900 rounded-xl p-3 mb-3" placeholder="Username"><input id="email" type="email" class="w-full bg-slate-900 rounded-xl p-3 mb-3" placeholder="Email"><input id="pass" type="password" class="w-full bg-slate-900 rounded-xl p-3 mb-4" placeholder="Password (6+) "><button onclick="auth(\'register\')" class="w-full bg-indigo-600 rounded-xl p-3 font-bold">Create Account</button>'}authMode('login');
async function auth(m){try{let d=await api('/api/auth/'+m,{method:'POST',body:JSON.stringify(m==='login'?{email:$('email').value,password:$('pass').value}:{username:$('name').value,email:$('email').value,password:$('pass').value})});tok=d.token;localStorage.setItem('tf_token',tok);start()}catch(e){$('am').textContent=e.message;$('am').className='text-center text-sm mt-3 text-rose-300'}}
async function start(){try{me=await api('/api/me');$('auth').classList.add('hide');$('app').classList.remove('hide');$('su').textContent=me.username;nav();await load();connect();go('dashboard')}catch(e){logout()}}
async function load(){ts=await api('/api/tasks');render()}function logout(){localStorage.removeItem('tf_token');tok=null;location.reload()}function toggleSide(){$('side').classList.toggle('open')}
function nav(){let items=[['dashboard','🏠','Dashboard'],['tasks','📋','My Tasks'],['today','☀️','Today'],['upcoming','⏰','Upcoming'],['overdue','⚠️','Overdue'],['important','⭐','Important'],['calendar','📅','Calendar'],['analytics','📊','Analytics'],['notifications','🔔','Notifications'],['profile','👤','Profile'],['settings','⚙️','Settings']];$('nav').innerHTML=items.map(x=>`<button id="n-${x[0]}" onclick="go('${x[0]}')" class="w-full text-left rounded-xl p-3">${x[1]} ${x[2]}</button>`).join('')}
function go(p){page=p;$('side').classList.remove('open');document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));$('n-'+p).classList.add('active');let names={dashboard:['Dashboard','Your productivity overview'],tasks:['My Tasks','Manage every task'],today:['Today','Focus on today'],upcoming:['Upcoming','Plan ahead'],overdue:['Overdue','Needs attention'],important:['Important','Starred tasks'],calendar:['Calendar','Tasks by date'],analytics:['Analytics','Productivity insights'],notifications:['Notifications','Reminders'],profile:['Profile','Account details'],settings:['Settings','Preferences']};$('pt').textContent=names[p][0];$('ps').textContent=names[p][1];render()}
function render(){let c=$('content');if(page==='dashboard')c.innerHTML=dashboard();else if(page==='calendar')c.innerHTML=calendar();else if(page==='analytics')analytics(c);else if(page==='profile')c.innerHTML=profile();else if(page==='settings')c.innerHTML=settings();else if(page==='notifications')c.innerHTML=notices();else{let a=page==='tasks'?ts:page==='today'?ts.filter(t=>key(t.due_at)===key(new Date())):page==='upcoming'?ts.filter(t=>t.due_at&&new Date(t.due_at)>=new Date()&&key(t.due_at)!==key(new Date())):page==='overdue'?ts.filter(over):ts.filter(t=>t.important);c.innerHTML=list(a)}}
function key(d){return d?new Date(d).toISOString().slice(0,10):''}function over(t){return t.due_at&&t.status!=='done'&&new Date(t.due_at)<new Date()}function stat(a,b){return `<div class="glass rounded-2xl p-4"><small class="text-slate-500">${a}</small><b class="text-2xl block mt-2">${b}</b></div>`}
function dashboard(){let done=ts.filter(t=>t.status==='done').length,tot=ts.length,p=tot?Math.round(done/tot*100):0;return `<div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-5">${stat('Total',tot)}${stat('Completed',done)}${stat('Pending',tot-done)}${stat('Overdue',ts.filter(over).length)}${stat('Completion',p+'%')}</div><div class="grid lg:grid-cols-3 gap-5"><section class="glass rounded-2xl p-5 lg:col-span-2"><div class="flex justify-between"><h3 class="font-black text-lg">Today's Tasks</h3><button onclick="go('today')" class="text-indigo-300 text-sm">View all</button></div><div class="mt-4">${ts.filter(t=>key(t.due_at)===key(new Date())).slice(0,6).map(card).join('')||empty('No tasks scheduled today')}</div></section><section class="glass rounded-2xl p-5"><h3 class="font-black">Today's Progress</h3><b class="text-4xl block mt-4">${p}%</b><div class="bar mt-3"><i style="width:${p}%"></i></div><button onclick="openTask()" class="w-full bg-indigo-600 rounded-xl p-3 mt-5 font-bold">+ New Task</button></section></div><section class="glass rounded-2xl p-5 mt-5"><h3 class="font-black mb-3">Recent Tasks</h3>${ts.slice(0,5).map(card).join('')||empty('Create your first task')}</section>`}
function list(a){return `<section class="glass rounded-2xl p-4 mb-4 flex flex-col md:flex-row gap-3"><input id="q" oninput="filterList()" class="flex-1 bg-slate-900 rounded-xl p-3" placeholder="🔎 Search tasks..."><select id="fs" onchange="filterList()" class="bg-slate-900 rounded-xl p-3"><option value="all">All status</option><option value="todo">To Do</option><option value="in-progress">In Progress</option><option value="done">Completed</option></select><button onclick="openTask()" class="bg-indigo-600 rounded-xl px-5 font-bold">+ New Task</button></section><div id="list">${a.map(card).join('')||empty('No tasks found')}</div>`}
function filterList(){let q=$('q').value.toLowerCase(),s=$('fs').value;let a=ts.filter(t=>(s==='all'||t.status===s)&&(`${t.title} ${t.description} ${t.category} ${t.tag}`).toLowerCase().includes(q));$('list').innerHTML=a.map(card).join('')||empty('No matching tasks')}
function card(t){return `<div class="glass rounded-2xl p-4 mb-3"><div class="flex gap-3"><button onclick="important(${t.id},${!t.important})">${t.important?'⭐':'☆'}</button><div class="flex-1"><div class="flex justify-between gap-2"><div><b class="${t.status==='done'?'line-through text-slate-500':''}">${esc(t.title)}</b><p class="text-xs text-slate-500 mt-1">${esc(t.description)}</p></div><div class="flex gap-2 text-xs"><button onclick="openTask(ts.find(x=>x.id===${t.id}))" class="bg-slate-800 rounded-lg px-2 py-1">Edit</button><button onclick="del(${t.id})" class="bg-rose-500/10 text-rose-300 rounded-lg px-2 py-1">Delete</button></div></div><div class="flex flex-wrap gap-2 text-[11px] mt-3"><span class="bg-slate-800 rounded px-2 py-1">${esc(t.category)}</span><span class="bg-indigo-500/15 text-indigo-300 rounded px-2 py-1">${esc(t.priority)}</span>${t.tag?`<span class="bg-slate-800 rounded px-2 py-1">#${esc(t.tag)}</span>`:''}${t.due_at?`<span class="${over(t)?'text-rose-300':'text-slate-400'}">📅 ${new Date(t.due_at).toLocaleString()}</span>`:''}</div><select onchange="status(${t.id},this.value)" class="bg-slate-900 rounded-lg p-2 text-xs mt-3"><option value="todo" ${t.status==='todo'?'selected':''}>To Do</option><option value="in-progress" ${t.status==='in-progress'?'selected':''}>In Progress</option><option value="done" ${t.status==='done'?'selected':''}>Completed</option></select></div></div></div>`}
function empty(x){return `<div class="glass rounded-2xl p-10 text-center text-slate-500">${x}</div>`}
function openTask(t=null){editId=t?.id||null;$('mt').textContent=t?'Edit Task':'New Task';['title','desc','tag','notes'].forEach((id,i)=>$(id).value=t?.[['title','description','tag','notes'][i]]||'');$('pri').value=t?.priority||'Medium';$('status').value=t?.status||'todo';$('cat').value=t?.category||'General';$('due').value=t?.due_at?new Date(t.due_at).toISOString().slice(0,16):'';$('rem').value=t?.reminder_minutes||0;$('imp').checked=!!t?.important;$('modal').classList.remove('hide');$('modal').classList.add('flex')}
function closeTask(){$('modal').classList.add('hide');$('modal').classList.remove('flex')}
async function saveTask(){let d={title:$('title').value.trim(),description:$('desc').value,notes:$('notes').value,priority:$('pri').value,status:$('status').value,category:$('cat').value,tag:$('tag').value,due_at:$('due').value||null,reminder_minutes:+$('rem').value,important:$('imp').checked};if(!d.title)return alert('Task title is required');try{await api(editId?'/api/tasks/'+editId:'/api/tasks',{method:editId?'PUT':'POST',body:JSON.stringify(d)});closeTask();await load()}catch(e){alert(e.message)}}
async function status(id,v){await api('/api/tasks/'+id,{method:'PUT',body:JSON.stringify({status:v})});await load()}async function important(id,v){await api('/api/tasks/'+id,{method:'PUT',body:JSON.stringify({important:v})});await load()}async function del(id){if(confirm('Delete this task?')){await api('/api/tasks/'+id,{method:'DELETE'});await load()}}
function calendar(){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate(),s=new Date(y,m,1).getDay(),h=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="text-center text-xs text-slate-500">${x}</div>`).join(''),cells='';for(let i=0;i<s;i++)cells+='<div></div>';for(let x=1;x<=n;x++){let k=`${y}-${String(m+1).padStart(2,'0')}-${String(x).padStart(2,'0')}`,a=ts.filter(t=>key(t.due_at)===k);cells+=`<div class="glass rounded-xl p-2 min-h-24"><b>${x}</b>${a.slice(0,3).map(t=>`<div class="text-[10px] truncate mt-1 bg-indigo-500/15 rounded px-1">${esc(t.title)}</div>`).join('')}</div>`}return `<section class="glass rounded-2xl p-5"><h3 class="font-black text-xl mb-5">${d.toLocaleString(undefined,{month:'long',year:'numeric'})}</h3><div class="grid grid-cols-7 gap-2">${h}${cells}</div></section>`}
async function analytics(c){let a=await api('/api/analytics');c.innerHTML=`<div class="grid lg:grid-cols-3 gap-5"><section class="glass rounded-2xl p-5"><h3 class="font-black mb-4">Status</h3>${Object.entries(a.status).map(([k,v])=>row(k,v)).join('')}</section><section class="glass rounded-2xl p-5"><h3 class="font-black mb-4">Priority</h3>${Object.entries(a.priority).map(([k,v])=>row(k,v)).join('')}</section><section class="glass rounded-2xl p-5"><h3 class="font-black mb-4">Categories</h3>${Object.entries(a.categories).map(([k,v])=>row(k,v)).join('')||'No data'}</section></div>`}function row(k,v){return `<div class="mb-4"><div class="flex justify-between text-sm"><span>${esc(k)}</span><b>${v}</b></div><div class="bar mt-1"><i style="width:${Math.min(v*20,100)}%"></i></div></div>`}
function notices(){let o=ts.filter(over),soon=ts.filter(t=>t.due_at&&t.status!=='done'&&(new Date(t.due_at)-new Date())<3600000&&(new Date(t.due_at)-new Date())>0);return `<div class="space-y-4">${o.length?`<div class="glass rounded-2xl p-5 text-rose-300">🔴 ${o.length} overdue task(s): ${o.map(t=>esc(t.title)).join(', ')}</div>`:''}${soon.length?`<div class="glass rounded-2xl p-5 text-amber-300">⏰ Due within an hour: ${soon.map(t=>esc(t.title)).join(', ')}</div>`:''}${!o.length&&!soon.length?empty('You are all caught up 🎉'):''}<button onclick="notify()" class="bg-indigo-600 rounded-xl px-4 py-3 font-bold">Enable Browser Notifications</button></div>`}
function profile(){return `<section class="glass rounded-2xl p-6 max-w-xl"><h3 class="font-black text-xl mb-5">Profile</h3><input id="pn" value="${esc(me.username)}" class="w-full bg-slate-900 rounded-xl p-3 mb-3"><input id="pe" value="${esc(me.email)}" class="w-full bg-slate-900 rounded-xl p-3 mb-4"><button onclick="saveProfile()" class="bg-indigo-600 rounded-xl px-5 py-3 font-bold">Save Profile</button></section>`}async function saveProfile(){me=await api('/api/me',{method:'PUT',body:JSON.stringify({username:$('pn').value,email:$('pe').value})});$('su').textContent=me.username;render()}
function settings(){return `<div class="grid md:grid-cols-2 gap-5"><section class="glass rounded-2xl p-6"><h3 class="font-black">Notifications</h3><p class="text-sm text-slate-500 mt-2">Browser reminders for due tasks.</p><button onclick="notify()" class="bg-indigo-600 rounded-xl px-4 py-2 mt-4">Enable Notifications</button></section><section class="glass rounded-2xl p-6"><h3 class="font-black">PWA</h3><p class="text-sm text-slate-500 mt-2">Installable responsive app with service worker.</p><p class="text-emerald-300 text-sm mt-4">● Ready</p></section></div>`}
async function notify(){if(!('Notification'in window))return alert('Notifications not supported');let p=await Notification.requestPermission();if(p==='granted')new Notification('TaskFlow Pro',{body:'Notifications are enabled.'})}function connect(){try{let s=io();s.emit('join_user',{user_id:me.id});s.on('tasks_changed',load)}catch(e){}}if(tok)start();if('serviceWorker'in navigator)navigator.serviceWorker.register('/static/service-worker.js');</script></body></html>
